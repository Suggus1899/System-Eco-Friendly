version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecogestion-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecogestion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ecogestion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecogestion-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ecogestion_db
      JWT_SECRET: your-secret-key-change-in-production
      FCM_SERVER_KEY: your-fcm-server-key
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecogestion-network
    command: npm run dev

  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: ecogestion-admin
    environment:
      REACT_APP_API_URL: http://localhost:3000/api
    ports:
      - "3001:3000"
    volumes:
      - ./admin-panel:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - ecogestion-network
    command: npm start

volumes:
  postgres-data:

networks:
  ecogestion-network:
    driver: bridge
